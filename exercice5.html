<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ST2AWD - TP01 - Exercice 5</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.7/aframe/build/aframe-ar.js"></script>

  <style>
    body { margin: 0; overflow: hidden; }
    #aide {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 999;
      background: rgba(0,0,0,0.7); color: #fff;
      font-family: system-ui, sans-serif; font-size: 13px;
      text-align: center; padding: 10px;
    }
  </style>
</head>
<body>

  <div id="aide">Pointe la camera vers le QR code : la boite apparait au centre.</div>

  <script>
    AFRAME.registerComponent('masquer-aide', {
      init: function () {
        var aide = document.getElementById('aide');
        this.el.addEventListener('markerFound', function () { aide.style.display = 'none'; });
        this.el.addEventListener('markerLost',  function () { aide.style.display = 'block'; });
      }
    });
  </script>

  <a-scene
      embedded
      vr-mode-ui="enabled: false"
      renderer="logarithmicDepthBuffer: true; precision: medium;"
      arjs="sourceType: webcam; detectionMode: mono; debugUIEnabled: false;">

    <a-marker preset="hiro" masquer-aide>
      <a-box
          position="0 0.5 0"
          width="1" height="1" depth="1"
          material="color: #2E86C1; opacity: 0.6; transparent: true"
          animation="property: rotation; to: 0 360 0; loop: true; dur: 4000; easing: linear">
      </a-box>
    </a-marker>

    <a-entity camera></a-entity>

  </a-scene>

</body>
</html>
