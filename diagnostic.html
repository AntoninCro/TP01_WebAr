<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diagnostic marqueur AR.js</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.7/aframe/build/aframe-ar.js"></script>

  <style>
    body { margin: 0; overflow: hidden; font-family: monospace; }
    #rapport {
      position: fixed; top: 0; left: 0; right: 0; z-index: 9999;
      background: rgba(0,0,0,0.82); color: #fff;
      font-size: 12px; line-height: 1.5; padding: 8px 10px;
      max-height: 45vh; overflow-y: auto; white-space: pre-wrap;
    }
    .ok   { color: #4ade80; }
    .ko   { color: #f87171; }
    .info { color: #93c5fd; }
  </style>
</head>
<body>

  <div id="rapport">Diagnostic en cours...</div>

  <script>
    // Change ce chemin si ton .patt s'appelle autrement
    var CHEMIN_PATT = 'pattern-rick.patt';

    var rapport = document.getElementById('rapport');
    function log(msg, classe) {
      rapport.innerHTML += '\n<span class="' + (classe || '') + '">' + msg + '</span>';
    }

    // ---- TEST 1 : le fichier .patt est-il reellement servi ? ----
    fetch(CHEMIN_PATT, { cache: 'no-store' })
      .then(function (r) {
        log('[1] HTTP ' + r.status + ' sur ' + CHEMIN_PATT, r.ok ? 'ok' : 'ko');
        if (!r.ok) throw new Error('fichier introuvable');
        return r.text();
      })
      .then(function (txt) {
        // ---- TEST 2 : le contenu a-t-il la bonne structure ? ----
        var blocs = txt.trim().split(/\n\s*\n/);
        var lignes = txt.trim().split('\n').filter(function (l) { return l.trim(); });
        log('[2] ' + txt.length + ' octets, ' + lignes.length +
            ' lignes utiles, ' + blocs.length + ' blocs');
        if (blocs.length === 4 && lignes.length === 192) {
          log('    structure valide (4 orientations x 48 lignes)', 'ok');
        } else {
          log('    STRUCTURE INVALIDE : attendu 4 blocs et 192 lignes', 'ko');
        }

        // ---- TEST 3 : contraste du motif ----
        var vals = blocs[0].trim().split('\n').map(function (l) {
          return l.trim().split(/\s+/).map(Number);
        });
        var plat = [].concat.apply([], vals);
        var min = Math.min.apply(null, plat);
        var max = Math.max.apply(null, plat);
        var sombres = plat.filter(function (v) { return v < 110; }).length;
        var pct = Math.round(100 * sombres / plat.length);
        log('[3] luminance ' + min + ' a ' + max + ', ' + pct + '% de pixels sombres');
        if (max - min < 120) log('    CONTRASTE TROP FAIBLE', 'ko');
        else if (pct < 15 || pct > 85) log('    motif trop vide ou trop plein', 'ko');
        else log('    contraste correct', 'ok');
      })
      .catch(function (e) {
        log('[!] echec du chargement : ' + e.message, 'ko');
        log('    -> le .patt n est pas au bon endroit ou pas commite', 'ko');
      });

    // ---- TEST 4 : evenements de detection ----
    AFRAME.registerComponent('trace', {
      init: function () {
        var nom = this.el.getAttribute('id');
        var el = this.el;
        el.addEventListener('markerFound', function () {
          log('[4] DETECTE : ' + nom, 'ok');
        });
        el.addEventListener('markerLost', function () {
          log('[4] perdu : ' + nom, 'info');
        });
      }
    });

    window.addEventListener('load', function () {
      setTimeout(function () {
        log('[i] pointe la camera vers Hiro puis vers ton marqueur perso.', 'info');
        log('[i] si Hiro est detecte et pas le tien, le probleme vient', 'info');
        log('    du marqueur (image ou .patt), pas du code.', 'info');
      }, 1500);
    });
  </script>

  <!-- debugUIEnabled affiche l image binarisee traitee par AR.js -->
  <a-scene
      embedded
      vr-mode-ui="enabled: false"
      arjs="sourceType: webcam; detectionMode: mono; debugUIEnabled: true;">

    <a-marker id="HIRO" preset="hiro" trace>
      <a-box position="0 0.5 0" material="color: #00e676; opacity: 0.7; transparent: true"></a-box>
    </a-marker>

    <a-marker id="PERSO" type="pattern" url="pattern-Anto.patt" trace>
      <a-sphere position="0 0.5 0" radius="0.5"
                material="color: #ff1744; opacity: 0.7; transparent: true"></a-sphere>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

</body>
</html>
